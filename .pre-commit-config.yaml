default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
        name: End-of-file fixer
      - id: mixed-line-ending
        name: Mixed line ending fixer
        args: [--fix, lf]
      - id: trailing-whitespace
        name: Remove trailing whitespaces
      - id: check-toml
        name: Check toml
      - id: check-yaml
        name: Check yaml
        exclude: |
          (?x)^(
              conda/pytorch-geometric/meta.yaml|
              conda/pyg/meta.yaml
          )$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: Lint yaml
        args: [-d, '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {level: error}, braces: {max-spaces-inside: 1}}}']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Check PEP8
        additional_dependencies: [Flake8-pyproject]
        # OASIS_Local 独自スクリプト(sim.py等)は厳格なPEP8(79文字)に合わない既存コードのため、
        # 行長を緩和し、実害のないスタイル違反を許容する。
        args: ["--max-line-length=130", "--extend-ignore=F401,F541,E261"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        name: Ruff formatting
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: Format Markdown
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter
          - mdformat_footnote
  - repo: local
    hooks:
      - id: check-license
        name: Check License
        # CI(ubuntu)でも確実に動くよう python3 を明示指定。
        entry: python3 licenses/update_license.py . licenses/license_template.txt
        language: system
        types: [python]
        # 上流OASISのライセンスヘッダは oasis/ 配下(上流コード)のみ対象。
        # ルートの独自スクリプトは OASIS_Local 固有のコードなので対象外とする。
        exclude: '^(sim\.py|check\.py|collect_bluesky\.py|generate_profiles\.py|test_text_action\.py|deploy\.py)$'
